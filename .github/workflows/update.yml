name: update-data
on:
  schedule:
    - cron: "*/5 13-21 * * 1-5"
  workflow_dispatch:
  push:
    paths: ["probe.mjs","fetch.mjs",".github/workflows/update.yml"]
permissions:
  contents: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node probe.mjs || true
      - run: node fetch.mjs
      - name: commit
        run: |
          git config user.name "flow-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || (git commit -m "data" && git push)
